services:
  open-seo:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=${PORT:-3001}
    ports:
      - "127.0.0.1:${PORT:-3001}:${PORT:-3001}"
    volumes:
      - open_seo_data:/app/.wrangler/state
volumes:
  open_seo_data:
